name: 打包并发布版本

on:
    push:
        tags: ['**']
    pull_request:
        branches: [master]
        paths: ['.github/workflows/release.yml']

permissions:
    contents: read

concurrency:
    group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

jobs:
    build:
        name: 打包与解压验证（${{ matrix.os }}）
        if: github.event.deleted != true
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-2025
                      output: dist-win
                      asset: Lookrun-windows-x64.zip
                    - os: macos-14
                      output: dist-mac
                      asset: Lookrun-macos-arm64.tar.gz
        env:
            BUILD_DIRECTORY: ${{ matrix.output }}
            RELEASE_ASSET: ${{ matrix.asset }}
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install --frozen-lockfile
            - name: 使用公开示例配置构建
              run: cp resources/models.example.json resources/models.json
            - name: 检查解压工具
              run: command -v unzip
            - name: 构建程序及完整运行依赖
              run: bun run build:exe
            - name: 压缩并解压 Windows 程序包
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  Compress-Archive -LiteralPath $env:BUILD_DIRECTORY -DestinationPath $env:RELEASE_ASSET
                  Expand-Archive -LiteralPath $env:RELEASE_ASSET -DestinationPath release-smoke
            - name: 压缩并解压 macOS 程序包，保留执行权限
              if: runner.os == 'macOS'
              run: |
                  tar -czf "$RELEASE_ASSET" "$BUILD_DIRECTORY"
                  mkdir release-smoke
                  tar -xzf "$RELEASE_ASSET" -C release-smoke
            - name: 检查解压后的依赖并启动程序
              run: bun scripts/build-smoke.ts "release-smoke/$BUILD_DIRECTORY"
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.asset }}
                  path: ${{ matrix.asset }}
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7

    release:
        name: 上传两个程序包并发布 Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: Lookrun-*
                  path: release
                  merge-multiple: true
            - name: 创建或更新当前 tag 的 Release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  test -s release/Lookrun-windows-x64.zip
                  test -s release/Lookrun-macos-arm64.tar.gz
                  if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
                    gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
                  fi
                  gh release upload "$RELEASE_TAG" release/Lookrun-windows-x64.zip release/Lookrun-macos-arm64.tar.gz --clobber
                  gh release edit "$RELEASE_TAG" --draft=false
